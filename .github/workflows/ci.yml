name: CI

on:
  pull_request:
    branches: [main]    # runs on every PR to main
  push:
    branches: [main]    # runs on every push to main

jobs:
  # ── Job 1: Run Tests ───────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: urlshortener_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'          # cache node_modules between runs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_URL: postgresql://postgres:password@localhost:5432/urlshortener_test
          REDIS_URL: redis://localhost:6379
          BASE_URL: http://localhost:3000

      - name: Security audit
        run: npm audit --audit-level=high

  # ── Job 2: Build Docker Image ──────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test             # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/url-shortener:latest
            ${{ secrets.DOCKER_USERNAME }}/url-shortener:${{ github.sha }}
          cache-from: type=gha       # use github actions cache
          cache-to: type=gha,mode=max

      - name: Image pushed successfully
        run: |
          echo "✅ Image pushed:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/url-shortener:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/url-shortener:${{ github.sha }}"